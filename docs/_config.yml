# 産学総合支援室のサイト（旧 support.spring8.or.jp）を GitHub Pages (Jekyll) で公開するための設定

title: JASRI 産学総合支援室
description: SPring-8の産業利用を支援するページです。産業利用報告会などのイベント情報も掲載

# 公開URL は https://info.jasri.jp/general-support/ 。
# info.jasri.jp は GitHub の組織 jasri-jp の組織サイト（jasri-jp.github.io リポジトリ）に付けた独自ドメインで、
# 組織の各リポジトリのサイトは https://info.jasri.jp/<リポジトリ名>/ で公開される。
# url + baseurl は canonical や og:url に使う。
url: "https://info.jasri.jp"
# リポジトリ名と同じにする（試験公開の https://jasri-jp.github.io/general-support/ でも同じ）。
baseurl: "/general-support"

# 旧 URL の support.spring8.or.jp は、別リポジトリ（support_redirect）でここへ転送する。

# まだ移行していないページ・フォームへのリンク先（移行期間用。現行サーバー）。
# 現行サーバーを止める前に "" にする（support.spring8.or.jp を転送に切り替えた後も
# ここが残っていると、新サイト → 旧 URL → 新サイトと転送が循環する）。
legacy_url: "https://support.spring8.or.jp"

# Google ドライブ（jasri-service.jp）に置いたファイルは _data/drive.yml で管理する。

encoding: utf-8
markdown: kramdown
exclude:
  - Gemfile.lock
  - vendor
