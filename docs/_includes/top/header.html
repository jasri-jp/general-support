{%- comment -%}
  上部ヘッダーとメニュー。現在のページは front matter の nav（例: nav: home）で指定する。
  メニュー項目は _data/top_menu.yml で管理する。
{%- endcomment -%}
<!-- Back to top button -->
<button id="btn-back-to-top" type="button" class="btn btn-success btn-floating">
  <i class="fas fa-arrow-up"></i>
</button>

<!-- Start Top Header -->
<div class="top-header wow fadeInDown">
  <div class="container">
      <div class="row align-bottom" id="top-row">
          <div class="col-12 col-sm-6 col-lg-8">
            産業分野のみなさまのホームページ<br>For Industrial Users
          </div>
        </div>
  </div>
</div>
<!-- /End Top Header -->

<!-- navbar -->
<div class="container" id="menu-tab">
  <div class="row">
  <div class="col-12">
    <nav class="navbar navbar-expand-lg navbar-light">
      <div class="container-fluid">
        <a class="navbar-brand" href=""></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
<ul class="navbar-nav me-auto m-2 mb-lg-0 nav nav-tabs">
{%- for item in site.data.top_menu %}
  <li class="nav-item">
    <a class="nav-link{% if page.nav == item.id %} active{% endif %}" href="{% include link.html path=item.path %}">{{ item.title }}</a>
  </li>
{%- endfor %}
</ul>
</div>
</div>
</nav>
</div>
</div>
</div>
