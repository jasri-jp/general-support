# 手元でサイトを立ち上げるための設定（pixi: https://pixi.sh）
#   pixi run setup   … 最初に1回。Jekyll などをこのフォルダの環境に入れる
#   pixi run serve   … http://127.0.0.1:4000/ で表示。ファイルを編集すると自動で作り直す
#   pixi run serve-lan … 同じネットワークの他の PC からも見られるように起動（ファイアウォールの許可が必要。README 参照）
#   pixi run build   … _site/ に出力するだけ
[workspace]
name = "general-support"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
ruby = "3.3.*"

[tasks]
setup = "ruby tools/setup.rb"
build = "ruby tools/local_server.rb --build-only"
serve = "ruby tools/local_server.rb"
serve-lan = "ruby tools/local_server.rb --host 0.0.0.0"
